# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-32

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crpjs32.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8E86F788EBED47A8ADB84FC3255DA5A2 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D623A21938A94989A883C4EC86130628 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crpjs32.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8E86F788EBED47A8ADB84FC3255DA5A2 }}/guestbook-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-32'
          slot-name: 'staging'
          images: 'crpjs32.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_8E86F788EBED47A8ADB84FC3255DA5A2 }}/guestbook-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BC15AFC3FBED4C22AA0B4812FC75A05E }}